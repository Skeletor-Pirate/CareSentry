[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "caresentry-ai"
version = "1.0.0-rc1"
description = "Deterministic Attention-Anchored Context Sentry & Invariant Verification Harness for Open-Weight Clinical Models"
readme = "README.md"
license = { text = "Apache-2.0" }
authors = [
    { name = "CareSentry-AI Maintainers", email = "maintainers@caresentry.local" }
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Healthcare Industry",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Scientific/Engineering :: Medical Science Apps."
]
requires-python = ">=3.10"
dependencies = [
    "torch>=2.2.0",
    "transformers>=4.40.0",
    "accelerate>=0.28.0",
    "numpy>=1.24.0",
    "scipy>=1.10.0",
    "rich>=13.7.0",
    "pydantic>=2.6.0"
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-cov>=4.0.0"
]

[project.scripts]
caresentry-probe = "harness.attention_probe:main"
caresentry-linter = "harness.clinical_linter:main"
caresentry-dashboard = "demo.cli_dashboard:main"

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_functions = ["test_*"]
pythonpath = [".", "src", "guard/src", "clinical/src", "plus/src"]

